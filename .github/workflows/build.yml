name: Build MAUI Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workloads
        run: |
          dotnet workload install maui-android
          dotnet workload restore BistroPOS.Mobile.csproj

      - name: Restore dependencies
        run: dotnet restore BistroPOS.Mobile.csproj

      - name: Build Android APK
        run: dotnet publish BistroPOS.Mobile.csproj -f net9.0-android -c Release -p:AndroidPackageFormats=apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BistroPOS-Mobile-APK
          path: |
            **/*.apk
            **/*Signed.apk
            **/bin/Release/net9.0-android/*.apk
